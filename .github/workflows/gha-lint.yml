name: 🔍 GHA Linter

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  lint:
    name: Validate GitHub Actions and YAML
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Run actionlint
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f  # v1.80.6
        with:
          reporter: github-pr-review

      - name: 🧪 Run yamllint
        uses: reviewdog/action-yamllint@8f84f0fb670d777d3e584ef50faf60eb61605b2a  # v1.25.3
        with:
          reporter: github-pr-review
          yamllint_flags: .github

      - name: 📝 Run markdownlint
        uses: reviewdog/action-markdownlint@0f00f9816d25b024975712a1ad4ea03dbf5848a6  # v0.31.7
        with:
          reporter: github-pr-review
          markdownlint_flags: "**/*.md"

      - name: 🛡️ Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
